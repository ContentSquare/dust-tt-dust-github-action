name: "Dust GitHub Action"
author: "Dust"
description: "Send data to your Dust workspace from GitHub Actions."

inputs:
  method:
    description: "Action to perform (upsert-skills, upsert-agent-configs)"
    required: true
  workspace-id:
    description: "Dust workspace ID"
    required: true
  api-key:
    description: "Dust API key"
    required: true
  region:
    description: "Dust workspace region (EU or US)"
    required: true
  names:
    description: "[upsert-skills] Newline-separated skill names to import. Omit to import all skills."
    required: false
  editors:
    description: "[upsert-skills] Newline-separated editor email addresses to add to imported or updated skills. Existing editors are preserved."
    required: false
  availability:
    description: "[upsert-skills] Availability to apply to imported or updated skills: editors (Editors only), workspace_users (All members) or users_and_agents (Members and agents). New skills default to editors and existing skills keep their availability when omitted."
    required: false
  on-conflict:
    description: "[upsert-skills] What to do when a skill with the same name already exists in the workspace: override (update the existing skill), skip (leave it unchanged and report it as skipped) or error (reject the whole import). Defaults to override. Updating existing skills requires an admin API key."
    required: false
  agent-configs:
    description: "[upsert-agent-configs] List of glob patterns matching YAML agent configuration files"
    required: false

outputs:
  json:
    description: "Raw JSON response from the Dust API"
  imported:
    description: "Number of newly imported items"
  updated:
    description: "Number of updated items"

runs:
  using: "node24"
  main: "dist/index.js"
